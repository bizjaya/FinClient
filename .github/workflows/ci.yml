name: CI

on:
  # Changes are tested on dev and in pull requests. main only receives dev once it is green, and a release tag runs the
  # full build and tests again before publishing, so a push to main runs nothing here.
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The release refuses a tag whose version has no changelog section, so check it here, before anything is tagged.
  versions:
    name: Package versions and changelog agree
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: All packages carry one version, and CHANGELOG.md has its section
        shell: bash
        run: |
          dotnet_version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' dotnet/src/FinClient/FinClient.csproj)
          npm_version=$(node -p "require('./typescript/package.json').version")
          python_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' python/pyproject.toml | head -n 1)
          if [[ -z "$dotnet_version" || "$dotnet_version" != "$npm_version" ]]; then
            echo "FinClient.csproj has '$dotnet_version' but typescript/package.json has '$npm_version'." >&2; exit 1
          fi
          if [[ "$python_version" != "$dotnet_version" ]]; then
            echo "python/pyproject.toml has '$python_version' but FinClient.csproj and typescript/package.json have '$dotnet_version'." >&2; exit 1
          fi
          if ! grep -Eq "^## ${dotnet_version//./\\.}( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## $dotnet_version' section." >&2; exit 1
          fi

  dotnet:
    name: .NET build and tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generated types and resources match spec/
        shell: pwsh
        run: ./scripts/generate-dotnet.ps1
      - run: node scripts/generate-surface.mjs
      - run: git diff --exit-code -- dotnet/src/FinClient/Generated
      - run: dotnet build dotnet/FinClient.slnx --configuration Release
      - run: dotnet test dotnet/FinClient.slnx --configuration Release

  typescript:
    name: TypeScript / Node ${{ matrix.node }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
        working-directory: typescript
      - run: npm run generate:types
        working-directory: typescript
      - run: npm run generate:surface
        working-directory: typescript
      - run: git diff --exit-code -- typescript/src/generated typescript/src/graph.generated.ts typescript/src/news.generated.ts typescript/src/social.generated.ts
      - run: npm run typecheck
        working-directory: typescript
      - run: npm test
        working-directory: typescript
      - run: npm run build
        working-directory: typescript
      - run: npm ls --omit=dev
        working-directory: typescript

  python:
    name: Python ${{ matrix.python }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install --editable "python[dev]"
      - name: Generated types and operations match spec/
        run: python scripts/generate_python.py
      - name: No generated file changed or appeared
        shell: bash
        run: |
          git diff --exit-code -- python/finclient/_generated
          test -z "$(git status --porcelain -- python/finclient/_generated)"
      - run: ruff check .
        working-directory: python
      - run: mypy
        working-directory: python
      - run: pytest
        working-directory: python
      - name: Build the sdist and wheel
        shell: bash
        run: |
          cp LICENSE python/LICENSE
          python -m build python --outdir "$RUNNER_TEMP/python-dist"
          ls "$RUNNER_TEMP/python-dist"

  # Daily (and on demand): have the live API descriptions of FinCopy, FinGraph, FinNews and FinSocial moved away from
  # spec/? A difference means the SDK needs regenerating and a release. GitHub pauses scheduled workflows after 60 days
  # without repository activity.
  spec-drift:
    name: Public API spec drift
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the live API descriptions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/live"
          for pair in fincopy:https://api.fincopy.io fingraph:https://x.fingraph.io finnews:https://x.finnews.io finsocial:https://x.finsocial.io; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
              "${pair#*:}/openapi/v1.json" --output "$RUNNER_TEMP/live/${pair%%:*}-v1.json"
          done
      - run: >-
          node scripts/check-spec-drift.mjs
          spec/fincopy-v1.json "$RUNNER_TEMP/live/fincopy-v1.json"
          spec/fingraph-v1.json "$RUNNER_TEMP/live/fingraph-v1.json"
          spec/finnews-v1.json "$RUNNER_TEMP/live/finnews-v1.json"
          spec/finsocial-v1.json "$RUNNER_TEMP/live/finsocial-v1.json"
