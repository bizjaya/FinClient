name: Release

# A tag vX.Y.Z on main publishes FinClient to nuget.org, finclient to npmjs.com and finclient to pypi.org through trusted
# publishing: GitHub's OIDC token is exchanged for a short-lived credential, so no long-lived registry key is stored
# here. Everything is built and tested before anything is published; NuGet and npm are published back to back, and
# PyPI follows in its own job (the `pypi` environment is what PyPI's trusted publisher is registered for).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          # Writes an .npmrc that reads NODE_AUTH_TOKEN. npm tries trusted publishing (OIDC) first and uses the token only
          # when no trusted publisher is set up yet (the very first release).
          registry-url: https://registry.npmjs.org

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "The tag must be vMAJOR.MINOR.PATCH, optionally with a pre-release suffix such as v1.2.0-beta.1." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Tag must be on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point at a commit on main." >&2
            exit 1
          fi

      - name: Release notes from the changelog
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          heading="## $VERSION"
          line=$(awk -v h="$heading" 'index($0, h) == 1 && (length($0) == length(h) || substr($0, length(h) + 1, 1) == " ") { print; exit }' CHANGELOG.md)
          if [[ -z "$line" ]]; then echo "CHANGELOG.md has no '$heading' section." >&2; exit 1; fi
          if [[ "${line,,}" == *unreleased* ]]; then echo "Date the '$heading' section in CHANGELOG.md before tagging." >&2; exit 1; fi
          awk -v h="$line" '$0 == h { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Build, test and pack the .NET package
        run: |
          dotnet restore dotnet/FinClient.slnx
          dotnet test dotnet/FinClient.slnx --configuration Release --no-restore
          dotnet pack dotnet/src/FinClient/FinClient.csproj --configuration Release --no-restore --output "$RUNNER_TEMP/nuget" /p:Version=${{ steps.version.outputs.value }}

      - name: Install the npm CLI that supports trusted publishing
        run: npm install --global npm@11.5.1

      - name: Build, test and pack the TypeScript package
        working-directory: typescript
        run: |
          npm ci
          npm run typecheck
          npm test
          npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version
          npm run build
          npm pack --dry-run

      - name: Build, test and pack the Python package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' python/pyproject.toml | head -n 1)
          if [[ "$python_version" != "$VERSION" ]]; then
            echo "python/pyproject.toml has '$python_version' but the tag is v$VERSION. Set the version there (PEP 440 for a pre-release) and tag again." >&2
            exit 1
          fi
          cp LICENSE python/LICENSE
          python -m pip install --upgrade pip
          python -m pip install --editable "python[dev]"
          python scripts/generate_python.py
          git diff --exit-code -- python/finclient/_generated
          (cd python && ruff check . && mypy && pytest)
          python -m build python --outdir "$RUNNER_TEMP/python-dist"
          python -m twine check "$RUNNER_TEMP"/python-dist/*

      - name: Keep the Python distributions for publishing
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: ${{ runner.temp }}/python-dist/
          if-no-files-found: error

      # Publishing starts only here, after all three packages built and passed their tests.
      - name: Login to NuGet trusted publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "$RUNNER_TEMP"/nuget/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish to npmjs.com
        working-directory: typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: v${{ steps.version.outputs.value }}
          body_path: ${{ runner.temp }}/release-notes.md

  # PyPI trusted publishing: register this repository, the workflow file release.yml and the environment `pypi` as a
  # trusted publisher of the finclient project on pypi.org. The job runs after the build job above has built and tested
  # everything, and a failed upload can be re-run on its own.
  publish-pypi:
    name: Publish to PyPI
    needs: publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - name: Publish to pypi.org
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
