version: 2
updates:
  - package-ecosystem: nuget
    directory: /dotnet
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      # The library's minimum supported versions (.NET 8 and .NET Standard 2.0). Raising them forces every consumer up,
      # so they move only by a deliberate change; patch releases still come through.
      - dependency-name: System.Text.Json
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: Microsoft.Extensions.Http
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: Microsoft.Bcl.AsyncInterfaces
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Only the tests reference it. Dependabot's update also adds it to the library as a direct reference (the library
      # gets it through Microsoft.Extensions.Http), which needs newer packages than the library's minimum versions and
      # fails the build. Bump the tests' version by hand.
      - dependency-name: Microsoft.Extensions.DependencyInjection
    groups:
      test-tools:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet*"]
  - package-ecosystem: npm
    directory: /typescript
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      # openapi-typescript, which generates the SDK's types, accepts TypeScript 5 only; a TypeScript major cannot install
      # beside it. Lift this when openapi-typescript supports the next major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
